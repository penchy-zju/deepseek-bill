name: DeepSeek Daily Usage Export

# schedule / cron 使用 UTC 时间。
# "0 17 * * *" = UTC 17:00 = 北京时间（UTC+8）次日 01:00。
# 例如：北京时间 2026-09-22 01:00 触发，抓取 2026-09-21 全天的数据。
on:
  schedule:
    - cron: "0 17 * * *"
  workflow_dispatch:

# 需要写权限才能把生成的数据提交回本仓库。
permissions:
  contents: write

# 同一时间只允许一个任务在跑，避免两个 run 同时提交造成推冲突。
concurrency:
  group: deepseek-daily-usage
  cancel-in-progress: false

jobs:
  export-usage:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch daily usage export
        id: fetch
        env:
          DEEPSEEK_PLATFORM_TOKEN: ${{ secrets.DEEPSEEK_PLATFORM_TOKEN }}
        run: |
          set -euo pipefail

          # ---------- 计算北京时间「前一天 00:00:00 ~ 当天 00:00:00」的区间 ----------
          # 全部用纯 epoch 算术完成，不依赖 tzdata（TZ=Asia/Shanghai 在部分环境不可靠），
          # 也不依赖 date 本地时区：runner 的本地时区与 UTC 是否一致都不影响结果。
          #
          # 关键点：北京时间 00:00 == 其前一天 UTC 16:00。
          # 先把「北京时间现在」按 86400 取整，得到北京时间当天零点的 epoch 表示，
          # 再减去 8 小时时差，就得到该零点的真实 UTC 时间戳。
          BEIJING_OFFSET=28800
          DAY=86400

          NOW=$(date -u +%s)
          if ! BEIJING_EPOCH=$(( NOW + BEIJING_OFFSET )); then
            echo "::error::failed to read current epoch time"
            exit 1
          fi
          ROUNDED_MIDNIGHT=$(( BEIJING_EPOCH - (BEIJING_EPOCH % DAY) ))

          # 最近一个「已完整结束」的北京日 = 当前北京日的前一天。
          TARGET_DATE=$(date -u -d "@$(( ROUNDED_MIDNIGHT - DAY ))" +%F)
          END=$(( ROUNDED_MIDNIGHT - BEIJING_OFFSET ))
          START=$(( END - DAY ))

          # ---------- 自检：区间必须正好 24 小时，且两端都落在 UTC 16:00 ----------
          if [ "$(( END - START ))" -ne 86400 ]; then
            echo "::error::unexpected interval $(( END - START ))s between START and END"
            exit 1
          fi
          if [ "$(( START % DAY ))" -ne 57600 ] || [ "$(( END % DAY ))" -ne 57600 ]; then
            echo "::error::window edges are not at 00:00 Beijing (START=${START}, END=${END})"
            exit 1
          fi
          # 归档日期标签必须与 START 对应的北京日期一致。
          LABEL_FROM_START=$(date -u -d "@$(( START + BEIJING_OFFSET ))" +%F)
          if [ "${LABEL_FROM_START}" != "${TARGET_DATE}" ]; then
            echo "::error::date label mismatch: ${LABEL_FROM_START} != ${TARGET_DATE}"
            exit 1
          fi

          echo "Current UTC        : $(date -u '+%F %H:%M:%S')"
          echo "Target usage date  : ${TARGET_DATE} (00:00 -> 24:00 Beijing)"
          echo "START (epoch)      : ${START}  = $(date -u -d "@${START}" '+%F %H:%M:%S') UTC = $(date -u -d "@$(( START + BEIJING_OFFSET ))" '+%F %H:%M:%S') UTC+8"
          echo "END   (epoch)      : ${END}  = $(date -u -d "@${END}" '+%F %H:%M:%S') UTC = $(date -u -d "@$(( END + BEIJING_OFFSET ))" '+%F %H:%M:%S') UTC+8"

          # 注意：写入 GITHUB_ENV 的变量只对后续 step 生效，本 step 内不可见，
          # 因此后续 step 需要先把它取到本地变量再用（不要直接展开该变量）。
          {
            echo "target_date=${TARGET_DATE}"
            echo "start=${START}"
            echo "end=${END}"
          } >> "$GITHUB_ENV"

          # ---------- 前置检查：token 是否配置 ----------
          # Secrets 未配置时是空字符串，提前失败并给出可操作的提示。
          if [ -z "${DEEPSEEK_PLATFORM_TOKEN:-}" ]; then
            echo "::error::Secret DEEPSEEK_PLATFORM_TOKEN is not set (Settings -> Secrets and variables -> Actions)."
            exit 1
          fi

          # ---------- 下载压缩包 ----------
          URL="https://platform.deepseek.com/api/v0/usage/export?start=${START}&end=${END}&tz=28800"
          HTTP_CODE=""
          for attempt in 1 2 3; do
            echo "Requesting export (attempt ${attempt}/3): ${URL}"
            # 不用 -f：先拿到状态码，便于区分 401/403（token 过期）
            # 与 200 但返回 JSON 错误体（接口变动）两种失败。
            HTTP_CODE=$(curl -sS -L \
              --connect-timeout 15 \
              --max-time 120 \
              -w '%{http_code}' \
              -H "Authorization: Bearer ${DEEPSEEK_PLATFORM_TOKEN}" \
              -H "Accept: */*" \
              -o usage.zip \
              "${URL}") && break || echo "::warning::curl failed on attempt ${attempt}"

            if [ "${attempt}" -eq 3 ]; then
              echo "::error::curl could not reach the export endpoint after 3 attempts"
              exit 1
            fi
            sleep 20
          done

          echo "HTTP status: ${HTTP_CODE}"
          echo "Downloaded bytes: $(wc -c < usage.zip)"

          case "${HTTP_CODE}" in
            200) ;;
            401|403)
              echo "::error::HTTP ${HTTP_CODE}: DEEPSEEK_PLATFORM_TOKEN is invalid or expired. Re-copy userToken from platform.deepseek.com LocalStorage and update the repo Secret."
              exit 1
              ;;
            *)
              echo "::error::Unexpected HTTP ${HTTP_CODE} from export endpoint"
              exit 1
              ;;
          esac

          # 必须是一个真正的 zip，否则说明拿到的是错误页/JSON 错误体。
          if ! unzip -t usage.zip >/dev/null 2>&1; then
            echo "::error::Response is not a valid zip archive; first 500 bytes:"
            head -c 500 usage.zip || true
            echo
            exit 1
          fi

      - name: Extract and parse amount CSV
        run: |
          set -euo pipefail

          # 来自上一个 step 通过 GITHUB_ENV 导出的值：必须在 step 内部先取到本地变量，
          # 因为 GITHUB_ENV 的变量不会在写入它的那个 step 内生效。
          TARGET_DATE="${target_date}"
          if [ -z "${TARGET_DATE}" ]; then
            echo "::error::target_date is empty; the fetch step did not complete correctly."
            exit 1
          fi

          WORK_DIR="$(mktemp -d)"
          echo "Extracting usage.zip -> ${WORK_DIR}"
          unzip -o usage.zip -d "${WORK_DIR}"

          echo "Archive contents:"
          find "${WORK_DIR}" -type f -printf '  %P (%s bytes)\n' | sort

          # 压缩包内含 amount 与 cost 两个 CSV，这里只取 amount。
          # 文件名可能带前缀/后缀（例如 amount_xxx.csv / usage-amount.csv），
          # 所以做模糊匹配，并显式排除 cost。
          mapfile -t AMOUNT_FILES < <(
            find "${WORK_DIR}" -type f -iname '*.csv' \
              ! -iname '*cost*' \
              \( -iname '*amount*' -o -iname '*usage*' \) | sort
          )

          if [ "${#AMOUNT_FILES[@]}" -eq 0 ]; then
            echo "::error::No amount CSV found inside the archive (looked for *amount*.csv / *usage*.csv, excluding cost)."
            exit 1
          fi
          if [ "${#AMOUNT_FILES[@]}" -gt 1 ]; then
            echo "::error::Ambiguous archive layout: ${#AMOUNT_FILES[@]} candidate amount CSVs found. Adjust the matcher in the workflow."
            printf '  %s\n' "${AMOUNT_FILES[@]}"
            exit 1
          fi

          AMOUNT_FILE="${AMOUNT_FILES[0]}"
          echo "Using amount CSV: ${AMOUNT_FILE}"

          DATA_DIR="data"
          TARGET="${DATA_DIR}/amount-${TARGET_DATE}.csv"
          mkdir -p "${DATA_DIR}"

          # 三件事一起做：
          # 1) 去掉 UTF-8 BOM——必须显式去掉：`read` 会把 BOM 字节一起读进变量，
          #    原样回写等于没去（曾因此让 BOM 混进仓库）；
          # 2) 去掉行尾的 \r——接口压缩包里的 CSV 是 CRLF，若原样入库，
          #    在 Windows 上 checkout 会因 autocrlf 变成 LF，导致同一份数据
          #    在不同平台呈现出差异；统一成 LF 后结果与平台无关；
          # 3) 对数据行做稳定排序——平台接口每次返回的行内容相同但**顺序会变**，
          #    不排序的话每次运行都会产生一个“假变更”，从而每次都提交一次数据。
          #    排序键取 (start_time, model, api_key, type)，既保证同一输入产出逐字节
          #    相同的结果，又让文件保持按时间排列、方便人看。
          read -r HEADER < "${AMOUNT_FILE}"
          HEADER="${HEADER#$'\xEF\xBB\xBF'}"   # 去 BOM
          HEADER="${HEADER%$'\r'}"             # 去 CR
          {
            printf '%s\n' "${HEADER}"
            tail -n +2 "${AMOUNT_FILE}" | tr -d '\r' | sort -t, -k2,2 -k4,4 -k6,6 -k7,7
          } > "${TARGET}"

          # 自检：写出后首字节必须是 'u'（表头 user_id），确认 BOM/CR 都已清掉。
          FIRST_BYTES=$(head -c 3 "${TARGET}" | od -An -tx1 | tr -d ' \n')
          if [ "${FIRST_BYTES}" != "7573" ] && [ "${FIRST_BYTES}" != "757365" ]; then
            echo "::error::extracted CSV still starts with unexpected bytes (${FIRST_BYTES}); expected 'us…'"
            exit 1
          fi

          BYTES=$(wc -c < "${TARGET}")
          ROWS=$(( $(wc -l < "${TARGET}") - 1 ))
          echo "Wrote ${TARGET} (${BYTES} bytes, ~${ROWS} data rows)"

          if [ "${BYTES}" -eq 0 ]; then
            echo "::error::Extracted amount CSV is empty; refusing to commit an empty file."
            rm -f "${TARGET}"
            exit 1
          fi

          # 只提交真正有数据行的文件；仅表头的文件正常退出（不算失败，避免误报）。
          if [ "${ROWS}" -le 0 ]; then
            echo "::warning::amount CSV has no data rows for ${TARGET_DATE} (header only)."
            rm -f "${TARGET}"
            echo "target_written=false" >> "$GITHUB_ENV"
          else
            echo "target_written=true" >> "$GITHUB_ENV"
            echo "target_path=${TARGET}" >> "$GITHUB_ENV"
          fi

          rm -rf "${WORK_DIR}"

      - name: Commit and push changes
        id: commit
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # 全流程统一用这个标记：任何一步真的产生了仓库变更就置为 true。
          echo "changed=false" >> "$GITHUB_OUTPUT"

          if [ "${target_written}" != "true" ]; then
            echo "No data rows produced for ${target_date}; nothing to commit."
            exit 0
          fi

          git add -- "${target_path}"

          # 内容没变就不提交，避免产生空提交（也不浪费一次 Pages 重新发布）。
          if [ -z "$(git diff --cached --name-only)" ]; then
            echo "Content unchanged for ${target_date}; nothing to commit."
            exit 0
          fi

          git status --short
          git commit -m "data: amount ${target_date}"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      # ---------- 用量看板：生成静态页面并提交 ----------
      # 纯标准库 Python 脚本，无需安装依赖。
      - name: Build usage dashboard
        id: build
        run: |
          set -euo pipefail
          python3 scripts/build_site.py
          echo "--- generated files ---"
          ls -l index.html site-data.json
          echo "--- embedded data head ---"
          python3 -c "import json;d=json.load(open('site-data.json',encoding='utf-8'));print('dates:',d['dates']);print('default:',d['default_date']);print('keys per day:',{k:len(v) for k,v in d['data'].items()})"

      - name: Verify generated dashboard
        run: |
          set -euo pipefail
          # 0) 自检 workflow 文件本身：语法坏掉的 workflow 会被 GitHub 直接忽略
          #    （连 workflow_dispatch 都会消失），必须在推送前拦住。
          python3 scripts/check_workflow.py
          # 1) 独立复算 CSV 聚合，并在 Node 里真实执行页面脚本来交叉校验
          node scripts/verify_site.js
          # 2) 在临时仓库里演练 gh-pages 发布逻辑（重复运行不应产生空提交）
          python3 scripts/test_publish.py

      - name: Commit dashboard
        id: page
        if: steps.build.outcome == 'success'
        run: |
          set -euo pipefail

          echo "dashboard_changed=false" >> "$GITHUB_OUTPUT"

          if [ ! -f index.html ]; then
            echo "::error::index.html was not generated"
            exit 1
          fi

          git add -- index.html site-data.json
          # 生成结果没变化就不提交：否则每天都会多出一条“site: rebuild dashboard”的空提交。
          if [ -z "$(git diff --cached --name-only)" ]; then
            echo "Dashboard already up to date; nothing to commit."
            exit 0
          fi

          git status --short
          git commit -m "site: rebuild dashboard ${target_date}"
          git push
          echo "dashboard_changed=true" >> "$GITHUB_OUTPUT"

      # ---------- 发布到 GitHub Pages ----------
      # 推到 gh-pages 分支：GitHub Pages 会自动使用该分支，无需在仓库 Settings 里手动选择目录。
      #
      # 不要用「本次运行是否产生了提交」来决定是否发布：如果生成结果本来就与 master 一致
      # （没有重建提交），发布就被跳过；而 gh-pages 一旦落后（例如上一次发布失败、
      # 或修复了生成逻辑），之后所有运行都会因为“没变化”而永远跳过发布，站点就一直停在旧版。
      # 因此这里直接比较「将要发布的快照」与 gh-pages 现有内容，只有真正一致才跳过。
      - name: Publish to gh-pages
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # 从 master 取当前生成结果；gh-pages 上只保留站点文件。
          # 必须先清空暂存目录：否则上一次运行留下的旧日期 CSV 会被一起复制回站点，
          # 让已经不该存在的文件“复活”。
          rm -rf "$RUNNER_TEMP/site"
          mkdir -p "$RUNNER_TEMP/site/data"
          cp index.html site-data.json "$RUNNER_TEMP/site/"
          # 用 if 包住：没有匹配文件时 cp 会以非 0 退出，在 set -e 下会中断整个步骤
          if compgen -G "data/amount-*.csv" >/dev/null; then
            cp data/amount-*.csv "$RUNNER_TEMP/site/data/"
          fi
          # 关闭 Jekyll 处理，避免下划线开头的路径被忽略。
          touch "$RUNNER_TEMP/site/.nojekyll"
          echo "staged for publish: $(ls -A "$RUNNER_TEMP/site" | tr '\n' ' ')"
          echo "staged csv count : $(ls -1 "$RUNNER_TEMP/site/data" | wc -l)"

          # 快照指纹：文件名 + 内容哈希，排序后整体再哈希。
          snapshot() {
            ( cd "$1" && find . -type f ! -name '.git' -printf '%P\n' | LC_ALL=C sort | while read -r f; do
                printf '%s ' "$f"; sha256sum "$f" | cut -d' ' -f1
              done ) | sha256sum | cut -d' ' -f1
          }
          WANT=$(snapshot "$RUNNER_TEMP/site")
          echo "desired snapshot: ${WANT}"

          # 注意：actions/checkout 默认只抓取默认分支，本地没有 origin/gh-pages，
          # 所以必须直接问远端（ls-remote），不能靠本地 ref 判断 gh-pages 是否存在。
          HAVE=""
          if git ls-remote --exit-code --heads origin gh-pages >/dev/null 2>&1; then
            git fetch --quiet --force origin refs/heads/gh-pages:refs/remotes/origin/gh-pages
            rm -rf "$RUNNER_TEMP/site-current"
            mkdir -p "$RUNNER_TEMP/site-current"
            git archive origin/gh-pages | tar -x -C "$RUNNER_TEMP/site-current"
            HAVE=$(snapshot "$RUNNER_TEMP/site-current")
            echo "current snapshot: ${HAVE}"
          else
            echo "gh-pages does not exist yet"
          fi

          if [ "${HAVE}" = "${WANT}" ]; then
            echo "gh-pages already matches the desired content; nothing to publish."
            exit 0
          fi

          # 切分支：--force 会一并丢弃工作区里被改动的已跟踪文件，
          # 因此不需要（也不应该）用 git clean——那会把 index.html/site-data.json
          # 之外的未跟踪目录一起删掉，且孤儿分支上没有 .gitignore 时更危险。
          if [ -n "${HAVE}" ]; then
            echo "gh-pages exists on remote; reusing it"
            # 用 reset --hard 而不是只靠 checkout --force：
            # checkout -B 在分支已存在时不会重建索引，索引里可能仍留着 master 的树，
            # 那样后面 git add -A 会把 README/scripts 等“删除”一起提交到 gh-pages。
            git checkout --force -B gh-pages
            git reset --hard origin/gh-pages
          else
            echo "gh-pages does not exist yet; creating an orphan branch"
            git checkout --force --orphan gh-pages
          fi
          git rm -r --cached . >/dev/null 2>&1 || true
          find . -mindepth 1 -maxdepth 1 ! -name '.git' -exec rm -rf {} +
          cp -r "$RUNNER_TEMP/site/." .

          # 自检：站点上的 CSV 数量必须与生成页面所用的天数一致，
          # 否则说明暂存/清理逻辑有问题（例如旧文件未清干净）。
          EXPECTED=$(python3 -c "import json;print(len(json.load(open('site-data.json',encoding='utf-8'))['dates']))" 2>/dev/null || echo "")
          case "${EXPECTED}" in
            ''|*[!0-9]*)
              echo "::error::could not read the day count from site-data.json (got '${EXPECTED}')"
              exit 1
              ;;
          esac
          ACTUAL=$(find data -name 'amount-*.csv' | wc -l)
          if [ "${EXPECTED}" != "${ACTUAL}" ]; then
            echo "::error::stale data on gh-pages: ${ACTUAL} csv file(s) staged but the page only covers ${EXPECTED} day(s)"
            exit 1
          fi

          git add -A
          if git diff --cached --quiet; then
            echo "gh-pages already up to date."
            exit 0
          fi
          git commit -m "publish: usage dashboard $(date -u +%F)"
          git push --force origin gh-pages
